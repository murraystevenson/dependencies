name: CI

on:
  push:
    branches:
      - main
      - '*_maintenance'
  pull_request:
    branches:
      - '*'
  release:
      types: [published]

jobs:

  build:

    strategy:

      # Don't cancel other jobs in the build matrix if one job fails.
      fail-fast: false

      matrix:

        # Rather than generate all permutations of various settings,
        # we want to explicitly list each of the variants we want to
        # test. We can use `name` to declare the names of our variants,
        # and then use `include` to define their settings.

        name: [
          linux-platform26,
          macos-platform26,
          windows-platform26,
        ]

        include:

          - name: linux-platform26
            os: ubuntu-24.04
            publish: true
            jobs: 4
            containerImage: ghcr.io/gafferhq/build/build:5.0.0a1
            partOneProjects: --projects LibFFI Python Boost Imath OpenEXR HDF5 Alembic BitstreamVera ZLib Blosc CMark PyBind11 LibJPEG-Turbo LibTIFF LibPNG OpenJPEG Expat YAML-CPP PyString Minizip OpenColorIO LibRaw PugiXML Fmt LibWebP TBB FreeType Robin-map OpenImageIO LLVM OpenShadingLanguage GLEW Nanobind OpenVDB
            partTwoProjects:  # Blank to build all remaining projects.

          - name: macos-platform26
            os: macos-15
            publish: true
            jobs: 3
            containerImage:
            partOneProjects:  # Blank to build all projects in a single job.

          - name: windows-platform26
            os: windows-2022
            publish: true
            jobs: 4
            containerImage:
            partOneProjects: --projects LibFFI TBB Python ZLib Boost Imath OpenEXR HDF5 Alembic BitstreamVera Blosc CMark PyBind11 LibJPEG-Turbo LibTIFF LibPNG OpenJPEG Expat YAML-CPP PyString Minizip OpenColorIO LibRaw PugiXML Fmt LibWebP FreeType OpenImageIO LLVM OpenShadingLanguage GLEW OpenVDB OpenSubdiv PyOpenGL Qt PySide
            partTwoProjects:  # Blank to build all remaining projects.

    uses: ./.github/workflows/buildPlatform.yml
    with:
      name: ${{ matrix.name }}
      os: ${{ matrix.os }}
      publish: ${{ matrix.publish }}
      jobs: ${{ matrix.jobs }}
      containerImage: ${{ matrix.containerImage }}
      partOneProjects: ${{ matrix.partOneProjects }}
      partTwoProjects: ${{ matrix.partTwoProjects }}
